[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mta-wiki-docs"
version = "0.1.0"
description = "Incremental MediaWiki-to-Markdown sync for the MTA documentation skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mta-wiki-docs = "mta_wiki_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
